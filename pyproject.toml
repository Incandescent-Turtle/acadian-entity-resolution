[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acadian-entity-resolution"
version = "0.1.0"
description = "Duplicate detection in an Acadian genealogy database: R-GCN retrieval (RQ1) and LLM verification (RQ2)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Required library (DB access, Personne model, exact-name pooling, pairwise comparison).
    # Pinned to a commit on the `package-module` branch.
    "genealogie-acadienne @ git+https://github.com/Incandescent-Turtle/genealogie-acadienne.git@390628748c98999ed3e5f7192728dc125e37a5ab",
    # PyTorch: install the CUDA 12.6 build FIRST (see docs/HARDWARE.md); cu126 is the
    # last wheel line with Pascal (sm_61) kernels, and 2.14 is its last release.
    "torch>=2.14,<2.15",
    "torch-geometric==2.8.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "scikit-learn>=1.6",
    "sentence-transformers>=5,<6",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# uv: torch with CUDA 12.6 (last line with Pascal kernels) on Windows, CPU-only on Linux.
# pip ignores this; see docs/HARDWARE.md.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
acadian-er = "acadian_er.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:.*torch.jit.script.*:FutureWarning",
    "ignore:Failing to pass a value to the 'type_params':DeprecationWarning",
]
